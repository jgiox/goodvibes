name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-node:
    name: Node.js tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # setup-node errors when cache is 'npm' and no package-lock.json exists
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
          # ponytail: no cache-dependency-path — beginner projects are single-package, not monorepos

      # npm install (not npm ci) — new projects may lack package-lock.json on first push
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::warning::No lint script in package.json — add one (for example eslint) so CI catches mistakes"
          fi

  test-python:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # python-version must be explicit — setup-uv does not auto-read matrix.python (Pitfall 4)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}

      # uv sync installs the dev group by default; --all-extras adds dev deps kept under optional-dependencies
      - name: Install dependencies
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync --all-extras || uv sync
          elif [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          fi

      - name: Lint
        run: uvx ruff check .

      - name: Run tests
        run: |
          if find . -name "test_*.py" -not -path "./.venv/*" | grep -q .; then
            uv run pytest -x -q
          else
            echo "::warning::No tests found — add a tests/ directory to get started"
          fi
