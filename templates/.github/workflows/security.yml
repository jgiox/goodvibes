name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    # Private repos need GitHub Advanced Security for CodeQL; without it the job always fails.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect languages
        id: langs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a schedule event has no repository payload, so the job-level private check lets it through
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" ]; then
            echo "::notice::Private repository, so CodeQL was skipped (it needs GitHub Advanced Security)"
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          langs=""
          if [ -n "$(find . -name '*.py' -not -path './.venv/*' -not -path '*/node_modules/*' | head -1)" ]; then
            langs="python"
          fi
          if [ -n "$(find . \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.venv/*' -not -path '*/node_modules/*' | head -1)" ]; then
            langs="${langs:+$langs,}javascript-typescript"
          fi
          if [ -z "$langs" ]; then
            echo "::notice::No Python, JavaScript or TypeScript files yet, so CodeQL was skipped"
          fi
          echo "value=$langs" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.langs.outputs.value != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.langs.outputs.value }}
          queries: security-extended

      - name: Autobuild
        if: steps.langs.outputs.value != ''
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.langs.outputs.value != ''
        uses: github/codeql-action/analyze@v4

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner /repo # v8.30.1
