name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Private repos need GitHub Advanced Security for CodeQL; without it the job always fails.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect languages
        id: langs
        run: |
          py=$(find . -name "*.py" -not -path "./.venv/*" | head -1)
          js=$(find . \( -name "*.js" -o -name "*.ts" \) -not -path "*/node_modules/*" | head -1)
          langs=""
          [ -n "$py" ] && langs="python"
          [ -n "$js" ] && [ -n "$langs" ] && langs="python,javascript-typescript"
          [ -n "$js" ] && [ -z "$langs" ] && langs="javascript-typescript"
          [ -z "$langs" ] && langs="python"
          echo "value=$langs" >> $GITHUB_OUTPUT

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.langs.outputs.value }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner /repo # v8.30.1
