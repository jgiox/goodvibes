name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # python-version must be explicit — setup-uv does not auto-read matrix.python (Pitfall 4)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}

      # uv sync installs the dev group by default; --all-extras adds dev deps kept under optional-dependencies
      - name: Install dependencies
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync --all-extras || uv sync
          elif [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          fi

      - name: Lint
        run: uvx ruff@0.16.9 check .

      - name: Run tests
        run: |
          if find . -name "test_*.py" -not -path "./.venv/*" | grep -q .; then
            uv run pytest -x -q
          else
            echo "::warning::No tests found — add a tests/ directory to get started"
          fi
