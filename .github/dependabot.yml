version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/packages/npm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # "uv" updates pyproject.toml and uv.lock together; "pip" would leave uv.lock behind.
  - package-ecosystem: "uv"
    directory: "/packages/pip"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/workers/telemetry"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
