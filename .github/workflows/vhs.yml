name: VHS Demo

on:
  push:
    branches: [main]
    # ponytail: path filter prevents the GIF commit from re-triggering this workflow
    paths:
      - 'scripts/demo.tape'

permissions:
  contents: read

jobs:
  # Recording runs npm, apt and VHS code, so it gets no write token; only the commit job can push.
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install VHS and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd gpg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | \
            sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | \
            sudo tee /etc/apt/sources.list.d/charm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y vhs

      # Demo the CLI from this commit, not whatever goodvibes-cli release is latest on npm.
      - name: Build goodvibes from the checkout and link it globally so the VHS shell can run it
        working-directory: packages/npm
        run: |
          npm ci
          npm run prebuild
          npm run build
          npm link
          command -v goodvibes

      - name: Record demo
        run: |
          mkdir -p docs
          cd scripts && vhs demo.tape

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error

  commit:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # required by git-auto-commit-action to push the GIF

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: demo-gif
          path: docs

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        with:
          commit_message: 'chore(demo): regenerate demo.gif'
          file_pattern: 'docs/demo.gif'
