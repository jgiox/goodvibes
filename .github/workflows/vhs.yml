name: VHS Demo

on:
  push:
    branches: [main]
    # ponytail: path filter prevents the GIF commit from re-triggering this workflow
    paths:
      - 'scripts/demo.tape'

permissions:
  contents: read

# A newer demo.tape supersedes an older one; one run at a time keeps two GIF pushes from racing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Recording runs npm, apt and VHS code, so it gets no write token; only the commit job can push.
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install VHS and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd gpg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | \
            sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | \
            sudo tee /etc/apt/sources.list.d/charm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y vhs

      # Demo the CLI from this commit, not whatever goodvibes-cli release is latest on npm.
      - name: Build goodvibes from the checkout and link it globally so the VHS shell can run it
        working-directory: packages/npm
        run: |
          npm ci --ignore-scripts
          npm run prebuild
          npm run build
          npm link
          command -v goodvibes

      - name: Record demo
        run: |
          mkdir -p docs
          cd scripts && vhs demo.tape

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error

  commit:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # required by git-auto-commit-action to push the GIF

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: demo-gif
          path: docs

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c  # v7.2.1
        with:
          commit_message: 'chore(demo): regenerate demo.gif'
          file_pattern: 'docs/demo.gif'
