name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-npm:
    name: npm tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: packages/npm/package-lock.json

      - name: Install dependencies
        working-directory: packages/npm
        run: npm ci --ignore-scripts  # esbuild finds its binary through its optional dependency

      - name: Typecheck
        working-directory: packages/npm
        run: npm run typecheck

      - name: Build
        working-directory: packages/npm
        run: npm run build

      - name: Test
        working-directory: packages/npm
        run: npm test

  test-pip:
    name: pip tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        working-directory: packages/pip
        run: uv run --extra dev pytest tests/ -x -q

  smoke-test:
    name: Phase smoke harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-npm, test-pip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run verify-phase5.sh
        run: bash scripts/verify-phase5.sh --quick

  check-stamps:
    name: Version stamps in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check version stamps are in sync
        run: |
          NPM_VER=$(grep '"version"' packages/npm/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          PIP_VER=$(grep '^version' packages/pip/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TPL_VER=$(grep '^# goodvibes: v' templates/CLAUDE.md | sed 's/# goodvibes: v//')

          echo "npm:      $NPM_VER"
          echo "pip:      $PIP_VER"
          echo "template: $TPL_VER"

          if [ "$NPM_VER" != "$PIP_VER" ] || [ "$NPM_VER" != "$TPL_VER" ]; then
            echo ""
            echo "ERROR: Version stamps are out of sync."
            echo "Fix: update templates/CLAUDE.md header to '# goodvibes: v$NPM_VER'"
            echo "Fix: update packages/pip/pyproject.toml version to match packages/npm/package.json"
            exit 1
          fi
          echo "All stamps in sync: v$NPM_VER"
