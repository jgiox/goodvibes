name: Publish npm package

on:
  push:
    tags:
      - 'npm-v*'   # trigger: git tag npm-v1.0.1 && git push origin npm-v1.0.1
  workflow_dispatch:  # manual button in GitHub Actions UI

permissions:
  contents: read

# One release at a time, and never cancel one half way through.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # A dispatch from another branch could run an edited workflow and publish with valid provenance.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Allow only main, or a tag on main whose version matches package.json
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/npm-v*)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge the release to main, then tag a commit on main."
                exit 1
              fi
              PKG_VERSION=$(node -p "require('./packages/npm/package.json').version")
              if [ "${GITHUB_REF_NAME#npm-v}" != "$PKG_VERSION" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match packages/npm/package.json version $PKG_VERSION. Tag npm-v$PKG_VERSION instead."
                exit 1
              fi
              ;;
            *)
              echo "::error::Publishing runs only from main or an npm-v* tag on main, not $GITHUB_REF. Run the workflow from main."
              exit 1
              ;;
          esac

  test:
    name: npm tests (Node ${{ matrix.node }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # esbuild finds its platform binary through its optional dependency, so the build needs no install scripts.
      - name: Install dependencies
        working-directory: packages/npm
        run: npm ci --ignore-scripts

      - name: Sync templates
        working-directory: packages/npm
        run: npm run prebuild

      - name: Typecheck
        working-directory: packages/npm
        run: npm run typecheck

      # Build first: dist-cli.integration.test.ts runs the built CLI.
      - name: Build
        working-directory: packages/npm
        run: npm run build

      - name: Test
        working-directory: packages/npm
        run: npm test

  # Build without the publish token, so a compromised build dependency cannot publish.
  build:
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: packages/npm
        run: npm ci --ignore-scripts

      # npm runs the prebuild script (template sync) before build.
      - name: Build
        working-directory: packages/npm
        run: npm run build

      - name: Verify package contents
        working-directory: packages/npm
        run: |
          npm pack --dry-run 2>&1 | grep -E "dist/|templates/"
          npm pack --dry-run 2>&1 | grep -c "src/" | grep "^0$"
          npm pack --dry-run 2>&1 | grep -cE " (LICENSE|NOTICE)$" | grep "^2$"

      - name: Read version
        id: version
        working-directory: packages/npm
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pack and smoke test the tarball
        working-directory: packages/npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm pack
          test -f "goodvibes-cli-$VERSION.tgz"
          PREFIX=$(mktemp -d)
          npm install -g --prefix "$PREFIX" "./goodvibes-cli-$VERSION.tgz"
          cd "$(mktemp -d)"
          "$PREFIX/bin/goodvibes" init --dry-run --scope project 2>&1 | tee "$RUNNER_TEMP/gv-pack-out.txt"
          grep -q "CLAUDE.md" "$RUNNER_TEMP/gv-pack-out.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-package
          path: packages/npm/goodvibes-cli-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

  # Publishes the exact tarball the build job tested; runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release  # needs a required reviewer; the npm trusted publisher is bound to this environment
    permissions:
      id-token: write  # npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance attached
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-package
          path: npm-package

      # No registry-url: setup-node would write an _authToken line to .npmrc that stops npm from using OIDC (actions/setup-node#1551).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # Trusted publishing needs npm >= 11.5.1; exact pin because this job holds id-token: write (bump by hand).
      - name: Upgrade npm
        run: npm install -g npm@11.20.0

      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "./npm-package/goodvibes-cli-$VERSION.tgz" --provenance --access public

  smoke-test:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # Version comes from the build job, so manual runs from main work as well as tag pushes.
      # A fresh version can take minutes to reach npm's CDN (ETARGET until then), so retry instead of a fixed sleep.
      # --prefer-online: the registry sends max-age=300, so without it every retry reuses the package list cached by the first miss.
      - name: Install from npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            npm install -g --prefer-online "goodvibes-cli@$VERSION" && exit 0
            echo "attempt $i: goodvibes-cli@$VERSION not installable yet, retrying in 15s"
            sleep 15
          done
          echo "::error::goodvibes-cli@$VERSION still not installable after 5 minutes"
          exit 1

      - name: Smoke test
        run: |
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          goodvibes init --dry-run --scope project 2>&1 | tee /tmp/gv-out.txt
          grep -q "CLAUDE.md" /tmp/gv-out.txt
