name: Publish pip package

on:
  push:
    tags:
      - 'pip-v*'   # trigger: git tag pip-v1.0.0 && git push origin pip-v1.0.0
  workflow_dispatch:  # manual button in GitHub Actions UI

permissions:
  contents: read

# One release at a time, and never cancel one half way through.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # A dispatch from another branch could run an edited workflow and publish with valid attestations.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Allow only main, or a tag on main whose version matches pyproject.toml
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/pip-v*)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge the release to main, then tag a commit on main."
                exit 1
              fi
              PKG_VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('packages/pip/pyproject.toml','rb'))['project']['version'])")
              if [ "${GITHUB_REF_NAME#pip-v}" != "$PKG_VERSION" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match packages/pip/pyproject.toml version $PKG_VERSION. Tag pip-v$PKG_VERSION instead."
                exit 1
              fi
              ;;
            *)
              echo "::error::Publishing runs only from main or a pip-v* tag on main, not $GITHUB_REF. Run the workflow from main."
              exit 1
              ;;
          esac

  test:
    name: pip tests (Python ${{ matrix.python }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No cache in release runs: a cache saved by another run could change what gets built.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Test
        working-directory: packages/pip
        run: uv run --extra dev pytest tests/ -x -q

  # Build without the publish token, so a compromised build dependency cannot publish.
  build:
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false

      - name: Build wheel
        working-directory: packages/pip
        run: uv build --no-sources

      - name: Verify wheel name (PKG-01 — goodvibes-cli)
        run: test -f packages/pip/dist/goodvibes_cli-*.whl

      - name: Verify sdist carries LICENSE and NOTICE
        run: tar -tzf packages/pip/dist/goodvibes_cli-*.tar.gz | grep -cE '^goodvibes_cli-[^/]+/(LICENSE|NOTICE)$' | grep -q '^2$'

      - name: Smoke test the built wheel
        working-directory: packages/pip
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/goodvibes_cli-*.whl)
          python3 - "$WHEEL" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          required = ("goodvibes_cli/templates/CLAUDE.md", ".dist-info/licenses/LICENSE", ".dist-info/licenses/NOTICE")
          missing = [f for f in required if not any(n.endswith(f) for n in names)]
          if missing:
              sys.exit(f"::error::{sys.argv[1]} is missing {missing}")
          PY
          VENV="$(mktemp -d)/venv"
          uv venv "$VENV"
          uv pip install --python "$VENV/bin/python" "$WHEEL"
          cd "$(mktemp -d)"
          "$VENV/bin/goodvibes" init --dry-run --scope project 2>&1 | tee "$RUNNER_TEMP/gv-wheel-out.txt"
          grep -q "CLAUDE.md" "$RUNNER_TEMP/gv-wheel-out.txt"

      - name: Read version
        id: version
        working-directory: packages/pip
        run: echo "version=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pip-dist
          path: packages/pip/dist/
          if-no-files-found: error

  # Publishes the exact files the build job tested; runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release  # needs a required reviewer; the PyPI trusted publisher is bound to this environment
    permissions:
      id-token: write  # required for OIDC trusted publishing — no API token in repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pip-dist
          path: dist/

      # Trusted publishing through the PyPA action also uploads PEP 740 attestations (uv publish does not).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  smoke-test:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false

      # Pin the version just published: an unpinned install passes silently against the previous release
      # while PyPI's CDN catches up, so retry instead of a fixed sleep.
      - name: Install from PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            uv tool install --no-cache "goodvibes-cli==$VERSION" && exit 0
            echo "attempt $i: goodvibes-cli==$VERSION not installable yet, retrying in 15s"
            sleep 15
          done
          echo "::error::goodvibes-cli==$VERSION still not installable after 5 minutes"
          exit 1

      - name: Smoke test
        run: |
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          goodvibes init --dry-run --scope project 2>&1 | tee /tmp/gv-out.txt
          grep -q "CLAUDE.md" /tmp/gv-out.txt
