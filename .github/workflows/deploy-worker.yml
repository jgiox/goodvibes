name: Deploy Telemetry Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/telemetry/**'

# Never cancel a deploy half way through; the next one waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # wrangler 4 needs Node 22 or newer.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # Installs the wrangler version in package-lock.json; the action uses it instead of installing its own.
      - name: Install wrangler
        working-directory: workers/telemetry
        run: npm ci --ignore-scripts

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/telemetry
